<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;background:#07090b;color:#eef3f5;font-family:'Manrope',sans-serif;position:relative;overflow:hidden}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(210,230,238,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(210,230,238,.07) 1px,transparent 1px);background-size:100px 105px}
  .glow{position:absolute;right:-140px;top:-160px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(110,231,255,.28),transparent 65%)}
  .frame{position:absolute;inset:34px;border:1px solid rgba(210,230,238,.18)}
  .mark{position:absolute;left:72px;top:68px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px}
  .mark span{border:1px solid rgba(255,255,255,.55);padding:6px 8px}
  .mark i{display:block;width:34px;height:1px;background:#6ee7ff;box-shadow:12px 0 #6ee7ff}
  .tag{position:absolute;right:72px;top:74px;font:500 15px 'DM Mono',monospace;letter-spacing:.1em;color:#9aa5ac}
  h1{position:absolute;left:72px;top:182px;font-size:108px;line-height:.92;letter-spacing:-.065em;font-weight:500}
  h1 em{font-style:normal;color:rgba(238,243,245,.05);-webkit-text-stroke:2px rgba(238,243,245,.92)}
  .sub{position:absolute;left:76px;top:424px;font:500 20px 'DM Mono',monospace;letter-spacing:.09em;color:#b0b9be;text-transform:uppercase}
  .flow{position:absolute;left:76px;bottom:70px;display:flex;align-items:center;gap:18px;font:500 14px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
  .chip{border:1px solid rgba(210,230,238,.3);padding:10px 14px;color:#c3ccd1}
  .chip.ok{border-color:#6ee7ff;color:#6ee7ff;box-shadow:0 0 24px rgba(110,231,255,.18)}
  .arrow{color:#6ee7ff}
  .dots span{position:absolute;border-radius:50%}
</style></head><body>
<div class="grid"></div><div class="glow"></div><div class="frame"></div>
<div class="dots">
  <span style="left:870px;top:150px;width:7px;height:7px;background:#6ee7ff;box-shadow:0 0 14px #6ee7ff"></span>
  <span style="left:980px;top:240px;width:6px;height:6px;background:#ab91ff;box-shadow:0 0 12px #ab91ff"></span>
  <span style="left:1060px;top:170px;width:8px;height:8px;background:#c6ff72;box-shadow:0 0 14px #c6ff72"></span>
  <span style="left:940px;top:330px;width:5px;height:5px;background:#6ee7ff;box-shadow:0 0 10px #6ee7ff"></span>
  <span style="left:1090px;top:300px;width:6px;height:6px;background:#ab91ff;box-shadow:0 0 12px #ab91ff"></span>
</div>
<div class="mark"><span>PA</span><i></i><b>Peters Automatisering</b></div>
<div class="tag">EINDHOVEN · NL</div>
<h1>Less manual work.<br><em>More signal.</em></h1>
<div class="sub">Python automation · Dashboards · Integrations</div>
<div class="flow"><span class="chip">Messy export</span><span class="arrow">→</span><span class="chip">Validate</span><span class="arrow">→</span><span class="chip">Clean</span><span class="arrow">→</span><span class="chip ok">Checked report</span></div>
</body></html>
